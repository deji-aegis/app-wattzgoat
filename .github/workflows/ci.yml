name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Caller permissions set the CEILING for the reusable workflow.
permissions:
  actions: read
  checks: write
  contents: read
  id-token: write
  packages: write
  security-events: write
  pull-requests: write

jobs:
  pipeline:
    name: DevSecOps Pipeline
    uses: deji-aegis/platform-ci/.github/workflows/full-pipeline.yml@main
    with:
      image_name: wattzgoat
      gitops_repo: deji-aegis/platform-gitops
      gitops_app_name: wattzgoat
      environment: dev
      registry: 146814469006.dkr.ecr.eu-west-2.amazonaws.com
      helm_chart_path: deploy/helm
      helm_namespace: wattzgoat-dev
      languages: '["python"]' 
      fail_on_finding: false
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}